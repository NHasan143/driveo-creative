# Weekly dependency updates, grouped to keep PR noise low.
# Add an entry for backend/ (pip) and mobile/ (npm) when those apps exist.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(frontend)"

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
